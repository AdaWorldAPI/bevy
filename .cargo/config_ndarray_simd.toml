# Copy this file to `.cargo/config.toml` (or merge into your existing one)
# to build the AdaWorldAPI/ndarray SIMD polyfill with a CI-safe `target-cpu`.
#
# `target-cpu=x86-64-v3` (AVX2) is the only baseline that runs on every
# GitHub Actions runner. GitHub's stock runners are x86-64-v3 — they do NOT
# have x86-64-v4 (AVX-512) and SIGILL on AVX-512 instructions, so this file
# never sets v4. `crate::simd::F32x16` picks the 8-lane AVX2 path;
# `PREFERRED_F32_LANES` is 8.
#
# The polyfill still auto-detects the live CPU tier at runtime via
# `simd_caps()`, so results are correct on AVX-512 hosts too — the ndarray
# smoke test prints `simd_caps()` at startup, which surfaces the (expected)
# mismatch between a runtime `avx512f=true` host and this compile-time v3
# build (`PREFERRED_F32_LANES=8`).
#
# To emit AVX-512 *code* on a local AVX-512 box (Sapphire Rapids / Ice
# Lake-SP / Zen 4), build with `RUSTFLAGS="-C target-cpu=native"` yourself.
# Do NOT commit a v4 `target-cpu` here, and never run such a binary in CI.

[build]
rustflags = ["-C", "target-cpu=x86-64-v3"]
